version: 2

project_name: restoredrill

before:
  hooks:
    - go mod tidy

builds:
  - id: restoredrill
    main: ./cmd/restoredrill
    binary: restoredrill
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ahmadpiran/restoredrill/internal/buildinfo.Version={{.Version}}
      - -X github.com/ahmadpiran/restoredrill/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/ahmadpiran/restoredrill/internal/buildinfo.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*
      - examples/**

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # github.owner/name are inferred from the git remote at release time; set
  # explicitly only if that inference ever needs overriding.
  draft: false
  prerelease: auto
