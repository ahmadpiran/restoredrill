name: 'restoredrill'
description: 'Run a restoredrill restore drill on a PostgreSQL or MySQL backup and write a JSON evidence report.'
author: 'restoredrill'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  config:
    description: 'Path to the restoredrill config file.'
    required: false
    default: 'restoredrill.yml'
  version:
    description: 'restoredrill release to install: a tag (e.g. "v0.4.0"), or "latest".'
    required: false
    default: 'latest'
  trigger:
    description: 'How this drill was triggered: "scheduled" or "manual".'
    required: false
    default: 'scheduled'
  triggered-by:
    description: 'Who triggered this drill (recorded on the report; matters for manual runs).'
    required: false
    default: ''
  report-path:
    description: 'Where the report is written; must match report.path in your config.'
    required: false
    default: 'restoredrill-report.json'
  report-artifact-name:
    description: 'Name for the uploaded report artifact. Set to empty to skip uploading.'
    required: false
    default: 'restoredrill-report'

outputs:
  report-path:
    description: 'Path to the JSON evidence report produced by this run.'
    value: ${{ inputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Install restoredrill
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        repo="ahmadpiran/restoredrill"

        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "restoredrill: unsupported runner OS $RUNNER_OS, use a Linux or macOS runner" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "restoredrill: unsupported runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        tag="$VERSION"
        if [ "$tag" = "latest" ]; then
          tag="$(curl -fsSL -o /dev/null -w '%{url_effective}' "https://github.com/$repo/releases/latest")"
          tag="${tag##*/}"
        fi
        asset="restoredrill_${tag#v}_${os}_${arch}.tar.gz"
        base="https://github.com/$repo/releases/download/$tag"

        dir="$RUNNER_TEMP/restoredrill-bin"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/$asset" "$base/$asset"
        curl -fsSL -o "$dir/checksums.txt" "$base/checksums.txt"

        expected="$(grep " $asset\$" "$dir/checksums.txt" | cut -d' ' -f1)"
        if [ -z "$expected" ]; then
          echo "restoredrill: no checksum listed for $asset" >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$dir/$asset" | cut -d' ' -f1)"
        else
          actual="$(shasum -a 256 "$dir/$asset" | cut -d' ' -f1)"
        fi
        if [ "$expected" != "$actual" ]; then
          echo "restoredrill: checksum mismatch for $asset" >&2
          exit 1
        fi

        (cd "$dir" && tar -xzf "$asset" restoredrill)
        chmod +x "$dir/restoredrill"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run restoredrill
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        TRIGGER: ${{ inputs.trigger }}
        TRIGGERED_BY: ${{ inputs.triggered-by }}
      run: |
        set -euo pipefail
        args=(--config "$CONFIG" --trigger "$TRIGGER")
        if [ -n "$TRIGGERED_BY" ]; then
          args+=(--triggered-by "$TRIGGERED_BY")
        fi
        restoredrill "${args[@]}"

    - name: Upload evidence report
      if: always() && inputs.report-artifact-name != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ${{ inputs.report-path }}
        if-no-files-found: error
